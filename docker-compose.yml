services:
  rasheed-api:
    build: .
    image: rasheed:dev
    ports: ["8000:8000"]
    environment:
      RASHEED_REDIS_URL: redis://duplicate-cache:6379/0
    depends_on:
      duplicate-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/ready').status==200 else 1)"]
      interval: 10s
      start_period: 20s
      retries: 3

  duplicate-cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5