[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rasheed"
version = "0.1.0"
description = "Rasheed - Student financial-aid/scholarship screening (SDA-AIE-113 capstone)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "import-linter>=2.0",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, pure-logic tests",
    "integration: API tests via TestClient",
    "behavioural: tests against the real model",
    "slow: excluded from the per-commit gate",
]
addopts = "-q --strict-markers --cov=rasheed --cov-branch --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80

[tool.coverage.run]
omit = [
    "src/rasheed/batch.py",
    "src/rasheed/scripts/*",
    "src/rasheed/adapters/redis_duplicate_checker.py",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
ignore = ["B008", "C408"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false